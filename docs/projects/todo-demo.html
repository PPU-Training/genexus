<!doctype html>

<html class="light" lang="id">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Curator Tasks - Daftar Tugas</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "error-container": "#ffdad6",
                            "secondary-container": "#d6e3fb",
                            background: "#f8f9fa",
                            "secondary-fixed": "#d6e3fb",
                            "surface-container-low": "#f3f4f5",
                            "primary-fixed": "#dae2ff",
                            "on-surface": "#191c1d",
                            "on-primary-fixed-variant": "#0040a2",
                            "on-surface-variant": "#434654",
                            "on-tertiary-container": "#ffc6b2",
                            "inverse-primary": "#b2c5ff",
                            primary: "#003d9b",
                            "on-primary-container": "#c4d2ff",
                            "on-primary": "#ffffff",
                            "on-tertiary-fixed": "#380d00",
                            "surface-tint": "#0c56d0",
                            outline: "#737685",
                            "on-secondary-fixed-variant": "#3b485a",
                            "on-error-container": "#93000a",
                            "on-tertiary": "#ffffff",
                            "surface-container": "#edeeef",
                            "on-background": "#191c1d",
                            "on-secondary-fixed": "#0f1c2d",
                            "surface-container-highest": "#e1e3e4",
                            "surface-dim": "#d9dadb",
                            "inverse-surface": "#2e3132",
                            "surface-container-high": "#e7e8e9",
                            "outline-variant": "#c3c6d6",
                            "primary-container": "#0052cc",
                            "on-primary-fixed": "#001848",
                            "inverse-on-surface": "#f0f1f2",
                            tertiary: "#7b2600",
                            "surface-container-lowest": "#ffffff",
                            "on-secondary": "#ffffff",
                            "on-tertiary-fixed-variant": "#812800",
                            "tertiary-container": "#a33500",
                            "primary-fixed-dim": "#b2c5ff",
                            error: "#ba1a1a",
                            "on-secondary-container": "#586579",
                            "surface-bright": "#f8f9fa",
                            "tertiary-fixed-dim": "#ffb59b",
                            "surface-variant": "#e1e3e4",
                            surface: "#f8f9fa",
                            "secondary-fixed-dim": "#bac7de",
                            secondary: "#525f73",
                            "tertiary-fixed": "#ffdbcf",
                            "on-error": "#ffffff",
                        },
                        fontFamily: {
                            headline: ["Manrope"],
                            body: ["Inter"],
                            label: ["Inter"],
                        },
                        borderRadius: {
                            DEFAULT: "0.125rem",
                            lg: "0.25rem",
                            xl: "0.75rem",
                            full: "0.75rem",
                        },
                    },
                },
            };
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
            .task-row:hover {
                background-color: #edeeef; /* surface-container */
            }
            .no-line-boundary {
                border: none !important;
            }
        </style>
    </head>
    <body
        class="bg-background text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed"
    >
        <!-- Main Content Shell -->
        <main class="min-h-screen flex flex-col items-center">
            <!-- Dashboard Content -->
            <div class="max-w-7xl mx-auto w-full p-6 md:p-12 space-y-12">
                <!-- Header Section -->
                <section
                    class="flex flex-col md:flex-row md:items-end justify-between gap-6"
                >
                    <div>
                        <h2
                            class="font-headline font-extrabold text-4xl text-on-surface tracking-tight"
                        >
                            Daftar Tugas
                        </h2>
                        <p
                            class="font-body text-on-surface-variant mt-2 max-w-lg"
                        >
                            Manage your daily intentions and track progress with
                            editorial precision.
                        </p>
                    </div>
                    <button
                        class="bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full px-8 py-4 flex items-center gap-3 font-semibold transition-transform active:scale-95"
                    >
                        <span class="font-manrope">Tambah Tugas</span>
                    </button>
                </section>
                <!-- Filters Area -->
                <section
                    class="bg-surface-container-low rounded-xl p-6 flex flex-wrap items-center gap-6"
                >
                    <div class="flex-1 min-w-[280px]">
                        <label
                            class="font-inter font-bold text-[10px] uppercase tracking-widest text-on-surface-variant block mb-2"
                            >Filter Nama</label
                        >
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
                                >search</span
                            >
                            <input
                                class="w-full bg-surface-container-lowest border-none rounded-xl py-3 pl-12 pr-4 font-inter text-sm focus:ring-2 focus:ring-primary/10"
                                placeholder="Cari topik atau deskripsi..."
                                type="text"
                            />
                        </div>
                    </div>
                    <div class="w-full md:w-64">
                        <label
                            class="font-inter font-bold text-[10px] uppercase tracking-widest text-on-surface-variant block mb-2"
                            >Filter Status</label
                        >
                        <select
                            class="w-full bg-surface-container-lowest border-none rounded-xl py-3 px-4 font-inter text-sm focus:ring-2 focus:ring-primary/10 appearance-none cursor-pointer"
                        >
                            <option>Semua Status</option>
                            <option>Not Started</option>
                            <option>In Progress</option>
                            <option>Done</option>
                        </select>
                    </div>
                    <div class="self-end pb-1">
                        <button
                            class="bg-surface-container-high text-primary rounded-full px-6 py-3 font-inter text-sm font-semibold hover:bg-surface-container-highest transition-colors"
                        >
                            Reset Filter
                        </button>
                    </div>
                </section>
                <!-- Task Table / Content Area -->
                <section
                    class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden border border-surface-container-high"
                >
                    <div class="overflow-x-auto">
                        <table
                            class="w-full text-left border-collapse min-w-[800px]"
                        >
                            <thead class="bg-surface-container-low border-none">
                                <tr>
                                    <th
                                        class="py-4 px-8 font-inter font-bold text-[10px] uppercase tracking-widest text-on-surface-variant cursor-pointer group"
                                    >
                                        <div class="flex items-center gap-1">
                                            Topik
                                            <span
                                                class="material-symbols-outlined text-xs opacity-0 group-hover:opacity-100 transition-opacity"
                                                >unfold_more</span
                                            >
                                        </div>
                                    </th>
                                    <th
                                        class="py-4 px-8 font-inter font-bold text-[10px] uppercase tracking-widest text-on-surface-variant cursor-pointer group"
                                    >
                                        <div class="flex items-center gap-1">
                                            Due Date
                                            <span
                                                class="material-symbols-outlined text-xs opacity-0 group-hover:opacity-100 transition-opacity"
                                                >expand_more</span
                                            >
                                        </div>
                                    </th>
                                    <th
                                        class="py-4 px-8 font-inter font-bold text-[10px] uppercase tracking-widest text-on-surface-variant"
                                    >
                                        Status
                                    </th>
                                    <th
                                        class="py-4 px-8 font-inter font-bold text-[10px] uppercase tracking-widest text-on-surface-variant text-right"
                                    >
                                        Detail
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="divide-y-4 divide-background">
                                <!-- Row 1 (Done) -->
                                <tr class="task-row transition-colors group">
                                    <td class="py-5 px-8">
                                        <span
                                            class="font-manrope font-semibold text-on-surface"
                                            >Redesign Hero Section</span
                                        >
                                    </td>
                                    <td
                                        class="py-5 px-8 font-inter text-sm text-on-surface-variant"
                                    >
                                        24 Okt 2023
                                    </td>
                                    <td class="py-5 px-8">
                                        <span
                                            class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-bold bg-[#e6f4ea] text-[#137333] tracking-wide uppercase"
                                        >
                                            Done
                                        </span>
                                    </td>
                                    <td class="py-5 px-8 text-right">
                                        <div
                                            class="flex items-center justify-end gap-2"
                                        >
                                            <button
                                                class="p-2 rounded-full hover:bg-white text-primary transition-colors"
                                            >
                                                <span
                                                    class="material-symbols-outlined"
                                                    >edit</span
                                                >
                                            </button>
                                            <button
                                                class="p-2 rounded-full hover:bg-white text-error transition-colors"
                                            >
                                                <span
                                                    class="material-symbols-outlined"
                                                    >delete</span
                                                >
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <!-- Row 2 (In Progress) -->
                                <tr class="task-row transition-colors group">
                                    <td class="py-5 px-8">
                                        <span
                                            class="font-manrope font-semibold text-on-surface"
                                            >API Integration</span
                                        >
                                    </td>
                                    <td
                                        class="py-5 px-8 font-inter text-sm text-on-surface-variant"
                                    >
                                        28 Okt 2023
                                    </td>
                                    <td class="py-5 px-8">
                                        <span
                                            class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-bold bg-secondary-container text-primary tracking-wide uppercase"
                                        >
                                            In Progress
                                        </span>
                                    </td>
                                    <td class="py-5 px-8 text-right">
                                        <div
                                            class="flex items-center justify-end gap-2"
                                        >
                                            <button
                                                class="p-2 rounded-full hover:bg-white text-primary transition-colors"
                                            >
                                                <span
                                                    class="material-symbols-outlined"
                                                    >edit</span
                                                >
                                            </button>
                                            <button
                                                class="p-2 rounded-full hover:bg-white text-error transition-colors"
                                            >
                                                <span
                                                    class="material-symbols-outlined"
                                                    >delete</span
                                                >
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <!-- Row 3 (Not Started) -->
                                <tr class="task-row transition-colors group">
                                    <td class="py-5 px-8">
                                        <span
                                            class="font-manrope font-semibold text-on-surface"
                                            >Unit Testing</span
                                        >
                                    </td>
                                    <td
                                        class="py-5 px-8 font-inter text-sm text-on-surface-variant"
                                    >
                                        02 Nov 2023
                                    </td>
                                    <td class="py-5 px-8">
                                        <span
                                            class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-bold bg-surface-container-highest text-on-surface-variant tracking-wide uppercase"
                                        >
                                            Not Started
                                        </span>
                                    </td>
                                    <td class="py-5 px-8 text-right">
                                        <div
                                            class="flex items-center justify-end gap-2"
                                        >
                                            <button
                                                class="p-2 rounded-full hover:bg-white text-primary transition-colors"
                                            >
                                                <span
                                                    class="material-symbols-outlined"
                                                    >edit</span
                                                >
                                            </button>
                                            <button
                                                class="p-2 rounded-full hover:bg-white text-error transition-colors"
                                            >
                                                <span
                                                    class="material-symbols-outlined"
                                                    >delete</span
                                                >
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination Footer -->
                    <div
                        class="bg-surface-container-low px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-4"
                    >
                        <span
                            class="font-inter text-xs text-on-surface-variant font-medium"
                            >Halaman 1 dari 25
                        </span>
                        <div class="flex items-center gap-2">
                            <button
                                class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:bg-surface-container-high disabled:opacity-30"
                                disabled=""
                            >
                                <span class="material-symbols-outlined"
                                    >chevron_left</span
                                >
                            </button>
                            <div class="flex items-center gap-1">
                                <button
                                    class="w-10 h-10 flex items-center justify-center rounded-full bg-primary text-on-primary font-inter text-sm font-bold"
                                >
                                    1
                                </button>
                                <button
                                    class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface font-inter text-sm"
                                >
                                    2
                                </button>
                                <button
                                    class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface font-inter text-sm"
                                >
                                    3
                                </button>
                            </div>
                            <button
                                class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:bg-surface-container-high"
                            >
                                <span class="material-symbols-outlined"
                                    >chevron_right</span
                                >
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
